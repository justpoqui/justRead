[package]
name = "tauri-plugin-justdevice"
description = "Small Android integrations for justRead: share sheet and reader screen control."
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
# Required by tauri-plugin's build script (it links the Android project).
links = "tauri-plugin-justdevice"

[dependencies]
serde.workspace = true
tauri = "2"                     # Apache-2.0 OR MIT

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }  # Apache-2.0 OR MIT
