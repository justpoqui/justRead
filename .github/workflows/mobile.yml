#
# Android and iOS builds (Phase 6). The native projects are generated by the
# Tauri CLI on each run (`tauri android|ios init --ci`) until they need
# hand-made customizations, at which point they will be committed.
# Docs: https://v2.tauri.app/distribute/

name: Mobile builds

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; use its own sdkmanager (the
      # setup-android action tries to install the long-removed "tools" package).
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm tauri android init --ci
      - name: Build a debug APK (arm64)
        run: pnpm tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: justread-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    # Experimental: a simulator build without code signing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci
      - name: Build for the iOS simulator
        run: pnpm tauri ios build --debug --target aarch64-sim
