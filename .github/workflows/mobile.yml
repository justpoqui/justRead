#
# Android and iOS builds (Phase 6). The native projects are generated by the
# Tauri CLI on each run (`tauri android|ios init --ci`) until they need
# hand-made customizations, at which point they will be committed.
# Docs: https://v2.tauri.app/distribute/

name: Mobile builds

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    # Publishing GitHub Releases (the in-app updater's source) needs write access.
    permissions:
      contents: write
    env:
      NDK_VERSION: "27.2.12479018"
      # Signed releases need the permanent key (docs/RELEASES.md). Without it the
      # job falls back to a debug APK artifact, as before.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; use its own sdkmanager (the
      # setup-android action tries to install the long-removed "tools" package).
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm tauri android init --ci
      - name: Use the justRead launcher icons
        # Generated projects start with Tauri's default icons; copy ours in
        # (src-tauri/icons/android, made by `tauri icon` + scripts/make-icon.py).
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      # Which signing values are set up (yes/no only; values are never printed).
      # Values added under "Variables" instead of "Secrets" are reported too, so
      # a mix-up is easy to spot.
      - name: Signing setup check
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          S4: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          V1: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
          V2: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' }}
          V3: ${{ vars.ANDROID_KEY_ALIAS != '' }}
          V4: ${{ vars.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo "secret ANDROID_KEYSTORE_BASE64:   $S1   (as a variable: $V1)"
          echo "secret ANDROID_KEYSTORE_PASSWORD: $S2   (as a variable: $V2)"
          echo "secret ANDROID_KEY_ALIAS:         $S3   (as a variable: $V3)"
          echo "secret ANDROID_KEY_PASSWORD:      $S4   (as a variable: $V4)"
          if [ "$S1$S2$S3$S4" != "truetruetruetrue" ]; then
            echo "::warning title=Signing key not set up::Missing repository secrets (see docs/RELEASES.md); building the debug APK instead."
          fi

      # Every build gets a higher version (0.2.<run number>), so Android accepts
      # it as an update and the in-app updater can tell it is newer.
      - name: Version
        run: |
          BASE=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          echo "VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"

      # ----- without the signing key: debug build, as before --------------------
      - name: Build a debug APK (arm64)
        if: env.HAS_KEY != 'true'
        run: pnpm tauri android build --debug --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY != 'true'
        with:
          name: justread-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ----- with the signing key: signed release build -------------------------
      - name: Build a release APK (arm64)
        if: env.HAS_KEY == 'true'
        run: pnpm tauri android build --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"
      - name: Sign with the justRead key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/justread.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/justread.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out justRead.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs justRead.apk | head -3
          sha256sum justRead.apk > justRead.apk.sha256
          rm -f "$RUNNER_TEMP/justread.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: justread-android
          path: justRead.apk
          if-no-files-found: error
      # Published from main only; other branches just build (as a downloadable artifact).
      - name: Publish the GitHub Release (the in-app updater reads the latest one)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format='%B' | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > "$RUNNER_TEMP/notes.md"
          gh release create "android-v$VERSION" justRead.apk justRead.apk.sha256 \
            --title "justRead $VERSION (Android)" --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" --latest

  ios:
    runs-on: macos-15
    # Experimental: a simulator build without code signing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci
      - name: Use the justRead app icons
        run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      - name: Build for the iOS simulator
        run: pnpm tauri ios build --debug --target aarch64-sim
