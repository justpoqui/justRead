[package]
name = "justread-app"
description = "justRead — offline, cross-platform ebook reader (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# staticlib/cdylib are required for the Android/iOS builds in Phase 6.
name = "justread_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }   # Apache-2.0 OR MIT

[dependencies]
justbook.workspace = true
justread-formats.workspace = true
justread-library.workspace = true
justread-locator.workspace = true
serde.workspace = true
serde_json.workspace = true
# "unstable" enables multi-webview windows (Window::add_child) on desktop,
# used by justBrowse (docs/adr/0008-justbrowse.md).
tauri = { version = "2", features = ["unstable"] }  # Apache-2.0 OR MIT
tauri-plugin-dialog = "2"                         # Apache-2.0 OR MIT
# Already in the dependency tree via Tauri; used directly by the justBrowse proxy.
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] } # MIT

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via Tauri/wry; used to set justBrowse's cookie policy explicitly.
webkit2gtk = "2"                                  # MIT
# Also already in the tree; used to lay out justBrowse's two webviews in GTK's box.
gtk = "0.18"                                      # MIT

[target.'cfg(target_os = "macos")'.dependencies]
# Proxy support for WKWebView (macOS 14+), needed for the justBrowse blocklist.
tauri = { version = "2", features = ["unstable", "macos-proxy"] }

[dev-dependencies]
tempfile.workspace = true
